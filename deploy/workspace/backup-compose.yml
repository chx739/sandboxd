name: sandboxd-workspace-backup
services:
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z@sha256:6d770d7f255cda1f18d841ffc4365cb7e0d237f6af6a15fcdb587480cd7c3b93
    command: ["server", "/data", "--address", ":9000"]
    env_file:
      - ${SANDBOXD_BACKUP_MINIO_ENV_FILE:?Use a private native Linux credential file outside the repository}
    environment:
      MINIO_BROWSER: "off"
      GOMAXPROCS: "1"
      GOMEMLIMIT: "192MiB"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /root/.minio:size=16m,mode=0700
    volumes:
      - repository-data:/data
    ports:
      - "127.0.0.1:9002:9000"
    networks: [kind]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    restart: "no"
volumes:
  repository-data:
networks:
  kind:
    external: true
    name: kind
