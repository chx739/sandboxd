NFS_CORE_PARAM {
    Protocols = 4;
    NFS_Port = 2049;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}
NFSv4 {
    Minor_Versions = 1;
    Graceless = false;
}
NFS_KRB5 { Active_krb5 = false; }
EXPORT {
    Export_Id = 1;
    Path = /export/workspaces;
    Pseudo = /workspaces;
    Access_Type = RW;
    Squash = Root_Squash;
    # gVisor's trusted gofer accesses this host mount as root. Map squashed
    # requests to the same unprivileged workspace identity, never to UID 0.
    Anonymous_uid = 65532;
    Anonymous_gid = 65532;
    SecType = sys;
    Protocols = 4;
    Transports = TCP;
    FSAL { Name = VFS; }
}
LOG {
    Default_Log_Level = WARN;
}
