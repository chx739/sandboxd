[project]
name = "sandboxd-agentd"
version = "0.1.0"
description = "sandboxd Pi-style 安全运维 Agent Runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain-core==1.5.6",
    "langchain-openai==1.5.2",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
rag = [
    "pymilvus==2.5.6",
    "sentence-transformers==5.1.2",
    "torch==2.8.0+cpu",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
